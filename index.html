ns la cour, une élève trouve une montre. Elle la donne à la maîtresse. À la récréation suivante, son propriétaire la récupère.","Pourquoi la fille remet-elle la montre ?","pour qu'on retrouve son propriétaire","pour la vendre","pour la casser","Qui rend finalement la montre ?","la maîtresse","le facteur","le gardien du parc"],["La famille arrive à la gare, mais les portes du train se ferment. Le train démarre sans eux. Ils regardent le panneau des départs.","Pourquoi regardent-ils le panneau ?","pour trouver un autre train","pour acheter du pain","pour voir un dessin","Ont-ils pris le premier train ?","non","oui","ils sont arrivés trop tôt"],["Hugo voudrait fabriquer un cerf-volant. Son père apporte du papier, des baguettes et de la ficelle. Ensemble, ils commencent le montage.","Quel objet veulent-ils fabriquer ?","un cerf-volant","un bateau","une maison","À quoi servira la ficelle ?","à tenir le cerf-volant","à cuisiner","à colorier"],["Ce soir, il n'y a plus de lumière dans le salon. Papa vérifie l'ampoule et découvre qu'elle est grillée. Il la remplace.","Pourquoi le salon est-il sombre ?","l'ampoule ne marche plus","la fenêtre est ouverte","le soleil brille","Que fait papa pour réparer ?","il change l'ampoule","il ferme le canapé","il ouvre le robinet"],["Mila court dans le jardin et entend un cri. Son frère est tombé près du vélo. Elle va chercher un adulte.","Qui est tombé ?","son frère","Mila","leur maman","Pourquoi Mila cherche-t-elle un adulte ?","pour aider son frère","pour jouer au ballon","pour faire les courses"],["Une petite fille a perdu son doudou au parc. Le gardien l'a trouvé sous un banc. Elle le récupère et le serre très fort.","Pourquoi serre-t-elle son doudou ?","elle est contente de le retrouver","elle veut le jeter","elle veut l'endormir","Où était le doudou ?","sous un banc","dans un arbre","derrière la porte"],["Au restaurant, le serveur apporte une soupe très chaude. Tom souffle dessus avant d'y goûter. Puis il la mange doucement.","Pourquoi Tom souffle-t-il ?","pour refroidir la soupe","pour la saler","pour la cacher","Comment mange-t-il ensuite ?","doucement","sans cuillère","en courant"],["La classe doit partir au musée. Il pleut beaucoup. La maîtresse demande aux élèves de prendre leurs manteaux avant de sortir.","Pourquoi faut-il des manteaux ?","parce qu'il pleut","parce qu'il neige dans le musée","parce que le bus est chaud","Où va la classe ?","au musée","au stade","au marché"],["L'ours sort de sa tanière au printemps. Il renifle l'air et cherche de la nourriture. Les jours deviennent plus longs.","Quelle saison commence ?","le printemps","l'automne","l'hiver","Pourquoi l'ours sort-il ?","pour chercher à manger","pour prendre un train","pour lire une lettre"],["Le pêcheur voit des déchets flotter près de son bateau. Il les attrape avec une épuisette et les jette dans une poubelle à terre.","Que ramasse le pêcheur ?","des déchets","des poissons","des coquillages","Pourquoi les met-il dans la poubelle ?","pour garder l'eau propre","pour attirer des poissons","pour réparer le bateau"],["La maîtresse donne un petit défi à la classe. Lina répond trop vite et se trompe. Elle relit la consigne puis trouve la bonne réponse.","Pourquoi Lina se trompe-t-elle d'abord ?","elle répond trop vite","elle n'a pas de crayon","elle n'est pas en classe","Que fait-elle pour réussir ?","elle relit la consigne","elle ferme son livre","elle copie sur un voisin"],["Un boulanger sort les baguettes du four. Il les place sur une grille pour qu'elles refroidissent. Une bonne odeur remplit la boutique.","Pourquoi les baguettes sont-elles sur une grille ?","pour refroidir","pour être peintes","pour être lavées","Où travaille le boulanger ?","dans une boulangerie","dans une pharmacie","dans une école"],["Le chien de Noé aboie devant une haie. Un chat apparaît puis grimpe sur un mur. Le chien reste en bas à le regarder.","Pourquoi le chien ne rejoint-il pas le chat ?","le chat est monté sur un mur","le chien dort","le chat a nagé","Où se trouve le chat à la fin ?","sur le mur","dans la haie","sous la table"],["Pendant une promenade, Sara entend le tonnerre. Elle voit un éclair au loin. Elle se met à l'abri avec sa famille.","Quel temps arrive ?","un orage","une journée sans nuages","une forte chaleur","Pourquoi Sara s'abrite-t-elle ?","pour se protéger de l'orage","pour manger une glace","pour écouter un livre"],["Un enfant met son vélo contre un mur sans l'attacher. Quand il revient, le vélo a bougé à cause du vent et est tombé.","Qu'est-il arrivé au vélo ?","il est tombé","il a été réparé","il s'est envolé","Quelle est la cause de la chute ?","le vent","la pluie","un train"],["Le petit frère de Mila veut attraper un jouet trop haut. Mila lui demande d'attendre, puis elle appelle son père.","Pourquoi appelle-t-elle son père ?","le jouet est trop haut","le jouet est cassé","le jouet est sale","Que veut faire son frère ?","attraper un jouet","ouvrir la fenêtre","dessiner"],["Un facteur arrive devant une maison avec un colis. Personne ne répond. Il laisse un avis pour que le colis soit retiré plus tard.","Pourquoi laisse-t-il un avis ?","personne n'est à la maison","le colis est trop lourd","il a terminé sa tournée","Que transporte le facteur ?","un colis","un gâteau","un ballon"],["Le sol est couvert de neige. Les enfants enfilent leurs bottes et leurs gants. Ils sortent pour fabriquer un bonhomme de neige.","Pourquoi mettent-ils des gants ?","pour se protéger du froid","pour jouer de la guitare","pour aller se baigner","Que veulent-ils construire ?","un bonhomme de neige","une cabane en bois","un château de sable"],["Les trois amis jouent au ballon. Le ballon passe au-dessus de la clôture. Ils vont demander au voisin la permission de le reprendre.","Pourquoi parlent-ils au voisin ?","pour récupérer le ballon","pour acheter une maison","pour promener son chien","Où est passé le ballon ?","au-delà de la clôture","dans un sac","sous un banc"],["Au petit matin, le coq chante. Le fermier ouvre le poulailler et donne à manger aux poules. Puis il ramasse les œufs.","Que fait le fermier en premier ?","il ouvre le poulailler","il ramasse les œufs","il part au marché","Quand se passe l'histoire ?","le matin","le soir","à minuit"],["Le réfrigérateur est resté entrouvert toute la nuit. Le matin, le lait n'est plus assez froid. Papa referme bien la porte.","Quel problème a eu le réfrigérateur ?","sa porte est restée ouverte","il a été débranché","il est tombé","Pourquoi le lait est-il moins froid ?","la porte était entrouverte","la cuisine est dans le noir","la bouteille est vide"],["L'enfant lit une histoire de pirates. Il voit un mot qu'il ne connaît pas. Il demande son sens avant de continuer.","Pourquoi s'arrête-t-il de lire ?","il ne comprend pas un mot","il a terminé le livre","il a perdu sa page","Que fait-il pour comprendre ?","il demande une explication","il déchire la page","il ferme le livre"],["La famille prévoit un pique-nique à la montagne. Elle regarde la météo et voit de fortes pluies annoncées. Le départ est reporté.","Pourquoi reporte-t-on la sortie ?","à cause du mauvais temps","parce que le repas est trop grand","parce que la voiture est bleue","Où devait aller la famille ?","à la montagne","à la plage","au cinéma"],["Un jeune arbre penche vers le chemin. Le jardinier plante un piquet à côté du tronc et attache l'arbre sans le serrer.","Pourquoi met-il un piquet ?","pour soutenir l'arbre","pour le couper","pour le cacher","Que fait le jardinier avec le tronc ?","il l'attache au piquet","il le peint","il le perce"],["Jules a acheté un cerf-volant. Le vent est faible et il n'arrive pas à le faire monter. Il décide de réessayer un autre jour.","Pourquoi le cerf-volant ne vole-t-il pas ?","il manque de vent","il pleut des pierres","il est trop rouge","Que décide Jules ?","d'essayer plus tard","de le jeter","de le couper"],["La rivière est sortie de son lit après une longue pluie. L'eau monte dans les champs. Les habitants évitent de s'approcher.","Quel est le danger ?","une inondation","un feu de forêt","une tempête de neige","Pourquoi reste-t-on à distance ?","l'eau déborde","les poissons dorment","il fait trop chaud"],["Un enfant trouve un oisillon tombé près d'un arbre. Sans le toucher, il prévient un adulte, qui observe la situation.","Qui le garçon prévient-il ?","un adulte","un chien","un pêcheur","Que fait l'enfant avec l'oisillon ?","il ne le touche pas","il le met dans sa poche","il le ramène en classe"],["À la fin du match, les deux équipes se serrent la main. Même ceux qui ont perdu sourient et remercient leurs adversaires.","Que font les joueurs après le match ?","ils se serrent la main","ils quittent le stade sans parler","ils jettent le ballon","Quelle attitude montrent-ils ?","du respect","de la méchanceté","de la peur"],["La bibliothèque ferme dans dix minutes. Mila veut encore lire un chapitre, mais elle choisit d'emprunter le livre pour finir chez elle.","Pourquoi Mila emprunte-t-elle le livre ?","pour continuer sa lecture","pour le cacher","pour le donner au chat","Où terminera-t-elle le chapitre ?","chez elle","dans la bibliothèque","dans la cour"],["Le boulanger prépare une surprise pour la fête de l'école. Il apporte un grand gâteau, mais oublie le couteau pour le couper.","Quel objet manque-t-il ?","un couteau","une assiette","un four","Pourquoi est-ce gênant ?","il faut partager le gâteau","le gâteau est brûlé","le gâteau est trop petit"],["La maîtresse a disposé trois pots sur la table. L'un contient du sable, un autre de l'eau, et le dernier de la terre. Les enfants doivent les observer.","Combien de pots y a-t-il ?","trois","deux","quatre","Que doivent faire les enfants ?","observer le contenu","manger le contenu","cacher les pots"],["Noé voit une araignée près de la fenêtre. Il ouvre doucement la fenêtre et l'aide à sortir avec un petit carton.","Pourquoi Noé ouvre-t-il la fenêtre ?","pour laisser sortir l'araignée","pour faire entrer la pluie","pour appeler ses amis","Quel objet utilise-t-il ?","un carton","une fourchette","un ballon"],["Léa économise depuis plusieurs semaines pour acheter un livre. Elle compare les prix et découvre qu'elle a assez de pièces.","Pourquoi garde-t-elle ses pièces ?","pour acheter un livre","pour acheter un vélo","pour prendre le bus","A-t-elle assez d'argent ?","oui","non","elle a tout perdu"],["La petite lampe de poche ne fonctionne plus. Hugo vérifie les piles, puis les remplace. La lumière se rallume aussitôt.","Comment Hugo répare-t-il la lampe ?","il change les piles","il la lave","il la secoue dans l'eau","Comment sait-il qu'elle marche ?","elle se rallume","elle devient lourde","elle sonne"],["Dans la forêt, des randonneurs découvrent des traces de sabots. Un peu plus loin, ils voient un chevreuil traverser le sentier.","Quel animal croisent-ils ?","un chevreuil","un renard","un sanglier","Que peuvent indiquer les traces ?","le passage d'un animal","la chute d'un arbre","la pluie de la veille"],["Une classe cultive des radis. Pendant les vacances, le gardien arrose les plants. À la rentrée, les radis ont grandi.","Qui arrose pendant les vacances ?","le gardien","les élèves","la directrice","Qu'est-ce qui a changé à la rentrée ?","les radis ont grandi","les radis ont disparu","les pots sont cassés"],["Le premier jour, les enfants observent une chenille sur une feuille. Une semaine plus tard, ils trouvent un cocon. Quelques jours passent, puis un papillon apparaît.","Quel animal voient-ils au début ?","une chenille","un papillon","une coccinelle","Quel animal apparaît à la fin ?","un papillon","un poussin","un poisson"]]}]</script>
  <script>
  (()=>{
    'use strict';
    const ALL=JSON.parse(document.getElementById('bank').textContent);
    const app=document.getElementById('app');
    const LEVELS=[
      {name:'Facile',desc:'Des phrases courtes et des mots familiers',sample:'« Le chat boit du … »'},
      {name:'Moyen',desc:'Des phrases plus longues et de petits indices',sample:'« Comme il pleut, … »'},
      {name:'Avancé',desc:'De petites histoires, des déductions et du sens',sample:'« Pourquoi le personnage … ? »'}
    ];
    const STORE='lecturo_bags_v1';
    let saved=loadState(),screen='home',level=0,questions=[],attempts=[],index=0,selected=null,feedback='idle',exitOpen=false;
    function loadState(){try{const data=JSON.parse(localStorage.getItem(STORE)||'{}');return data&&typeof data==='object'?data:{}}catch(e){return {}}}
    function saveState(){try{localStorage.setItem(STORE,JSON.stringify(saved))}catch(e){}}
    function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
    function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function getNextId(kind,lev,avoid){
      const key=lev+'_'+kind, max=ALL[lev][kind].length;
      if(!saved[key]||typeof saved[key]!=='object')saved[key]={remaining:[],recent:[]};
      const data=saved[key],used=new Set(avoid);
      data.remaining=data.remaining.filter(id=>Number.isInteger(id)&&id>=0&&id<max);
      if(data.remaining.length===0){
        const recent=new Set(data.recent.slice(-Math.min(20,max-1)));
        data.remaining=shuffle(Array.from({length:max},(_,i)=>i).filter(id=>!recent.has(id))).concat(shuffle(Array.from(recent)));
      }
      let indexToUse=data.remaining.findIndex(id=>!used.has(id));
      if(indexToUse<0){data.remaining=[];return getNextId(kind,lev,avoid)}
      const id=data.remaining.splice(indexToUse,1)[0];
      data.recent.push(id);
      if(data.recent.length>35)data.recent=data.recent.slice(-35);
      return id;
    }
    function makeRound(lev){
      const bank=ALL[lev],data=[],usedC=[],usedS=[];
      // Six phrases à compléter et quatre questions de compréhension par partie.
      for(let i=0;i<6;i++){
        const id=getNextId('cloze',lev,usedC);usedC.push(id);
        const [passage,answer,wrong1,wrong2]=bank.cloze[id];
        data.push({type:'cloze',id,passage,ask:'Quel mot complète la phrase ?',answer,options:shuffle([answer,wrong1,wrong2])});
      }
      const vKey=lev+'_versions'; if(!saved[vKey])saved[vKey]={};
      for(let i=0;i<4;i++){
        const id=getNextId('scenes',lev,usedS);usedS.push(id);
        const scene=bank.scenes[id];
        const turn=saved[vKey][id]===1?1:0;
        saved[vKey][id]=1-turn;
        const a=turn===0?scene.slice(1,5):scene.slice(5,9);
        data.push({type:'story',id,passage:scene[0],ask:a[0],answer:a[1],options:shuffle([a[1],a[2],a[3]])});
      }
      saveState();return shuffle(data);
    }
    function renderBrand(){return `<header class="topbar"><div class="brand"><div class="brand-mark" aria-hidden="true">✎</div><div class="brand-name">Lectur<span>O!</span></div></div><span class="top-note">Spécial CP</span></header>`}
    function home(){return `<main class="screen"><section class="hero"><div class="hero-kicker">Lire et comprendre</div><h1>Prêt pour un défi de lecture ?</h1><p>10 questions, trois réponses possibles et deux chances pour réussir !</p><span class="hero-star" aria-hidden="true">✦</span></section><h2 class="choose-title">Choisis ton niveau</h2><div class="level-list">${LEVELS.map((c,i)=>`<button type="button" class="level" data-level="${i}" aria-label="Niveau ${i+1}, ${escapeHtml(c.name)} : ${escapeHtml(c.desc)}"><span class="level-symbol">${i+1}</span><span class="level-copy"><span class="level-name">${escapeHtml(c.name)}</span><span class="level-desc">${escapeHtml(c.desc)}</span><span class="level-mini">${escapeHtml(c.sample)}</span></span><span class="level-arrow" aria-hidden="true">›</span></button>`).join('')}</div><div class="mini-features"><div class="mini-feature"><strong>10</strong>questions</div><div class="mini-feature"><strong>2</strong>essais par question</div><div class="mini-feature"><strong>600</strong>questions en réserve</div></div><p class="footer-hint">Pas de chronomètre. Prends le temps de lire ! 📖</p></main>`}
    function game(){
      const q=questions[index],res=attempts[index],finished=feedback==='good'||feedback==='missed';
      const dots=questions.map((x,i)=>`<span class="dot ${i<index?(attempts[i].success?'done':'missed'):i===index?'current':''}"></span>`).join('');
      let passage='';
      if(q.type==='cloze'){
        const val=finished?`<span class="blank has-answer">${escapeHtml(q.answer)}</span>`:`<span class="blank" aria-label="mot manquant">…</span>`;
        passage=escapeHtml(q.passage).replace('____',val);
      }else{passage=escapeHtml(q.passage)}
      const msg=feedback==='good'?`<div class="feedback good" role="status" aria-live="polite"><div class="feedback-title">✓ CORRECT</div><div class="feedback-sub">${res.tries.length===1?'Bravo, tu as bien compris !':'Bien joué, tu as trouvé !'}</div></div>`:feedback==='retry'?`<div class="feedback bad" role="status" aria-live="polite"><div class="feedback-title">✕ ERREUR</div><div class="feedback-sub">Relis bien : tu as une deuxième chance.</div></div>`:feedback==='missed'?`<div class="feedback bad" role="status" aria-live="polite"><div class="feedback-title">✕ ERREUR</div><div class="feedback-sub">La bonne réponse était : « ${escapeHtml(q.answer)} ».</div></div>`:`<div class="feedback idle" role="status" aria-live="polite"><div class="feedback-sub">Lis le texte et choisis la bonne réponse.</div></div>`;
      const used=res.tries;
      return `<main class="screen"><div class="game-top"><button type="button" class="go-back" data-action="ask-exit" aria-label="Quitter cette partie">‹</button><div class="game-top-title"><strong>Lecture · ${LEVELS[level].name}</strong><small>À ton rythme, sans chronomètre</small></div><span class="top-spacer"></span></div><div class="progress-heading"><span>Ta progression</span><strong>${index+1} / 10</strong></div><div class="progress-dots" aria-label="Question ${index+1} sur 10">${dots}</div><section class="question-card"><div class="task-label">${q.type==='cloze'?'✏️ Complète la phrase':'🔎 Lis et réponds'}</div><div class="passage ${q.type==='story'?'story':''}">${passage}</div><p class="question-line">${escapeHtml(q.ask)}</p></section><div class="option-list" role="group" aria-label="Choix de réponse">${q.options.map((opt,i)=>{
        const isWrong=used.includes(opt)&&opt!==q.answer;
        const isCorrect=finished&&opt===q.answer;
        const isSelected=selected===opt&&!finished;
        const classes=['option',isCorrect?'correct':'',isWrong?'wrong':'',isSelected?'selected':''].filter(Boolean).join(' ');
        return `<button type="button" class="${classes}" data-choice="${i}" aria-pressed="${isSelected}" ${finished||isWrong?'disabled':''}><span class="option-letter">${isCorrect?'✓':isWrong?'✕':i+1}</span><span>${escapeHtml(opt)}</span></button>`;
      }).join('')}</div>${msg}<div class="action-area">${finished?`<button type="button" class="primary" data-action="next">${index===9?'Voir mon bilan':'Question suivante'} <span aria-hidden="true">→</span></button>`:`<button type="button" class="primary" data-action="check" ${selected===null?'disabled':''}>Je valide ✓</button>`}</div><p class="mini-tip">${finished?'Continue quand tu es prêt.':feedback==='retry'?'Prends ton temps pour cette seconde réponse.':'Choisis une réponse, puis valide.'}</p></main>`;
    }
    function summary(){
      const first=attempts.filter(x=>x.success&&x.tries.length===1).length,second=attempts.filter(x=>x.success&&x.tries.length===2).length,missed=attempts.filter(x=>!x.success).length,success=first+second;
      const message=success===10?'Tu as compris les dix questions ! Continue à lire de nouvelles histoires.':success>=7?'Très belle lecture ! Quelques phrases sont encore à explorer, continue tes entraînements.':success>=4?'Bravo pour tes efforts ! Chaque nouvelle lecture t’aide à mieux comprendre les phrases.':'Tu es allé jusqu’au bout des dix questions, bravo ! Lis chaque phrase tranquillement et réessaie.';
      return `<main class="screen"><div class="game-top"><button class="go-back" data-action="home" aria-label="Retour à l'accueil">‹</button><div class="game-top-title"><strong>Mon bilan</strong><small>Lecture · ${LEVELS[level].name}</small></div><span class="top-spacer"></span></div><section class="summary-hero"><span class="summary-trophy" aria-hidden="true">🏆</span><h1>Bravo, jeune lecteur !</h1><div class="score-line"><strong>${success}</strong><span>/ 10 réussis</span></div><p>${escapeHtml(message)}</p></section><div class="summary-stats"><div class="stat"><strong>${first}</strong><small>Du premier coup</small></div><div class="stat"><strong>${second}</strong><small>Au deuxième essai</small></div><div class="stat"><strong>${missed}</strong><small>À retravailler</small></div></div><h2 class="results-head">Mes 10 questions 📚</h2><div class="results-list">${questions.map((q,i)=>{
        const res=attempts[i],isFirst=res.success&&res.tries.length===1,style=!res.success?'missed':isFirst?'first':'second',status=!res.success?'À revoir':isFirst?'✓ 1er essai':'✓ 2e essai';
        const description=q.type==='cloze'?q.passage.replace('____','…'):q.ask;
        return `<div class="result-row"><span class="result-number">${String(i+1).padStart(2,'0')}</span><div class="result-copy"><span class="result-question">${escapeHtml(description)}</span><span class="result-answer">Réponse : ${escapeHtml(q.answer)}</span></div><span class="result-tag ${style}">${status}</span></div>`;
      }).join('')}</div><div class="summary-actions"><button class="primary" data-action="replay">↻ Rejouer ce niveau</button><button class="secondary" data-action="home">Choisir un autre niveau</button></div></main>`;
    }
    function dialog(){return `<div class="overlay" role="presentation"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="exit-title"><div style="font-size:37px" aria-hidden="true">📖</div><h2 id="exit-title">Quitter la partie ?</h2><p>Tu n'as pas encore terminé les 10 questions. Ta partie ne sera pas enregistrée.</p><div class="dialog-buttons"><button class="secondary" data-action="cancel-exit">Continuer à lire</button><button class="primary" data-action="exit">Quitter la partie</button></div></div></div>`}
    function render(){app.innerHTML=(screen==='home'?renderBrand():'')+(screen==='home'?home():screen==='game'?game():summary())+(exitOpen?dialog():'');bind()}
    function scrollTop(){window.scrollTo({top:0,behavior:'instant'})}
    function start(lev){level=lev;questions=makeRound(lev);attempts=questions.map(()=>({tries:[],success:false}));index=0;selected=null;feedback='idle';exitOpen=false;screen='game';render();scrollTop()}
    function choose(i){if(screen!=='game'||feedback==='good'||feedback==='missed')return;const opt=questions[index].options[i];if(!opt||attempts[index].tries.includes(opt))return;selected=opt;render()}
    function check(){if(screen!=='game'||selected===null||feedback==='good'||feedback==='missed')return;const res=attempts[index],q=questions[index];if(res.tries.length>=2)return;res.tries.push(selected);if(selected===q.answer){res.success=true;feedback='good'}else{feedback=res.tries.length===2?'missed':'retry'}selected=null;render()}
    function next(){if(screen!=='game'||(feedback!=='good'&&feedback!=='missed'))return;if(index===9){screen='summary'}else{index++;selected=null;feedback='idle'}render();scrollTop()}
    function homeAgain(){screen='home';exitOpen=false;render();scrollTop()}
    function bind(){app.querySelectorAll('[data-level]').forEach(el=>el.addEventListener('click',()=>start(+el.dataset.level)));app.querySelectorAll('[data-choice]').forEach(el=>el.addEventListener('click',()=>choose(+el.dataset.choice)));app.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',()=>{switch(el.dataset.action){case 'check':check();break;case 'next':next();break;case 'replay':start(level);break;case 'home':homeAgain();break;case 'ask-exit':exitOpen=true;render();break;case 'cancel-exit':exitOpen=false;render();break;case 'exit':homeAgain();break;}}));}
    window.addEventListener('keydown',e=>{if(exitOpen){if(e.key==='Escape'){exitOpen=false;render()}return}if(screen!=='game'||e.altKey||e.ctrlKey||e.metaKey)return;if(/^[123]$/.test(e.key)){e.preventDefault();choose(Number(e.key)-1)}else if(e.key==='Enter'){e.preventDefault();if(feedback==='good'||feedback==='missed')next();else check()}});
    render();
    if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
  })();
  </script>
</body>
</html>
